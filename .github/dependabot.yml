version: 2
updates:
  - package-ecosystem: maven
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: npm
    target-branch: "develop"
    directory: "/exe-icon-maven-plugin/src/main/js"
    schedule:
      interval: "weekly"
      day: "saturday"
